name: Deploy to Timeweb via FTP

# Запускается на каждый push в master.
# Заливает только статику (index.html + img/ + bg.png + doors-armora.json + robots.txt + sitemap.xml).
# Перед первым запуском добавь секреты в репозиторий:
#   gh secret set FTP_HOST     -b "ftp.example.timeweb.ru"
#   gh secret set FTP_USERNAME -b "login"
#   gh secret set FTP_PASSWORD -b "password"
#   gh secret set FTP_DIR      -b "/public_html/"   # путь на сервере, опционально

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || '/' }}
          protocol: ftp
          # Что НЕ заливать на хостинг
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.kilo/**
            **/node_modules/**
            **/_drafts*.json
            **/*.applied.json
            **/package*.json
            **/*.backup.html
            **/*.before-*.html
            **/catalog.html
            **/survey.html
            **/doors-editor.html
            **/download-photos.js
            **/sync-catalog.js
            **/apply-drafts.js
            **/update-door.js
            **/PROJECT.md
            **/FILLING-WORKFLOW.md
            **/README.md
